name: Sync repository

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'


concurrency:
  group: sync-repository
  cancel-in-progress: false

env:
  SOURCE_REPO: TongSherbet/storage
  TARGET_DIR: storage

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Clone source repo
        run: |
          git clone --depth 1 "https://github.com/${SOURCE_REPO}.git" "$RUNNER_TEMP/source"
          echo "SOURCE_SHA=$(git -C "$RUNNER_TEMP/source" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Sync source into target folder
        run: |
          mkdir -p "$TARGET_DIR"
          # Mirror contents, delete files removed upstream, and skip the nested .git
          rsync -a --delete --exclude '.git/' "$RUNNER_TEMP/source/" "$TARGET_DIR/"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "$TARGET_DIR"

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync ${TARGET_DIR} from ${SOURCE_REPO}@${SOURCE_SHA}"
            git push
          fi
